name: hibalo_app
description: "Hibalo - Hiligaynon and Filipino Realtime Translator"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:            # ← App-language strings (gen-l10n)
    sdk: flutter
  flutter_tts: ^4.0.2
  # ── UI ─────────────────────────────────────
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  # ── Speech Recognition ─────────────────────
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  # ── Firebase ───────────────────────────────
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.5.0
  intl: ^0.20.2
  # ── Camera & OCR ───────────────────────────
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0
  # ── Storage ────────────────────────────────
  shared_preferences: ^2.3.0
  # ── URL Launcher ───────────────────────────
  url_launcher: ^6.3.0              # ← ADDED for Help & Support email button
  # ── NLP ────────────────────────────────────
  string_similarity: ^2.1.1         # ← ADDED for fuzzy text matching in NLPService
  flutter_onnxruntime: ^1.9.0
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  flutter_pcm_sound: ^3.3.3
  unorm_dart: ^0.3.0                # ← Unicode NFD/NFC for the offline translator
  android_intent_plus: ^6.1.0       # ← Opens the phone's voice install screen
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # ── App Icon Generator ─────────────────────
  flutter_launcher_icons: ^0.13.1
# ── APP ICON CONFIG ──────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
flutter:
  uses-material-design: true
  generate: true                    # gen-l10n, see l10n.yaml
  # ── ASSETS ─────────────────────────────────
  assets:
    - assets/logo.png
    - assets/Picture.png
    - assets/Book.png
    - assets/Voice.png
    - assets/Translate.png
    - assets/Account.png
    # Hiligaynon voice v4 (MMS-TTS, seed 7), from
    # C:/Hibalo-TTS-Mobile/models/hil_0619_v4_onnx_r. The .onnx file is
    # stored with Git LFS: install Git LFS before cloning/pulling, or the
    # voice won't load (tested on PC with generate_tts_v4.py).
    - assets/tts/models/
    # Offline Hiligaynon <-> Filipino translator (round-2 8x8 student, spec in
    # docs/translation/summary.md). The .onnx files are stored with Git LFS.
    - assets/translation/models/
    - assets/translation/data/
    # Learning module. Only folders that exist are listed: Flutter stops the
    # build on a missing folder. Add assets/audio/bNN/, assets/images/words/,
    # assets/images/culture/ and assets/images/situations/ here when their
    # files arrive. Until then the app treats those files as missing.
    - assets/lessons/
    - assets/images/lessons/
    - assets/images/mascots/
    - assets/images/avatars/
    - assets/images/profile/

  # V6 font for the learning screens (SIL Open Font License, see OFL.txt).
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-ExtraBoldItalic.ttf
          weight: 800
          style: italic
