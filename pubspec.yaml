name: hibalo_app
description: "Hibalo - Hiligaynon and Filipino Realtime Translator"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.0.2
  # ── UI ─────────────────────────────────────
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  # ── Speech Recognition ─────────────────────
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  # ── Firebase ───────────────────────────────
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.5.0
  intl: ^0.20.2
  # ── Camera & OCR ───────────────────────────
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0
  # ── Storage ────────────────────────────────
  shared_preferences: ^2.3.0
  # ── URL Launcher ───────────────────────────
  url_launcher: ^6.3.0              # ← ADDED for Help & Support email button
  # ── NLP ────────────────────────────────────
  string_similarity: ^2.1.1         # ← ADDED for fuzzy text matching in NLPService
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # ── App Icon Generator ─────────────────────
  flutter_launcher_icons: ^0.13.1
# ── APP ICON CONFIG ──────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
flutter:
  uses-material-design: true
  # ── ASSETS ─────────────────────────────────
  assets:
    - lib/assets/logo.png
    - lib/assets/images/greetings/
    - lib/assets/images/family/
    - lib/assets/images/food/
    - lib/assets/images/animals/
    - lib/assets/images/numbers/
    - lib/assets/images/emotions/
    - assets/Picture.png
    - assets/Book.png
    - assets/Voice.png
    - assets/Translate.png
    - assets/Account.png