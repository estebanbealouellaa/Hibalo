name: hibalo_app
description: "Hibalo - Hiligaynon and Filipino Realtime Translator"
publish_to: 'none'
version: 1.1.0+2
environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_tts: ^4.0.2
  provider: ^6.1.2
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.5.0
  intl: ^0.20.2
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0
  shared_preferences: ^2.3.0
  share_plus: ^11.0.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  flutter_onnxruntime: ^1.9.0
  audioplayers: ^6.8.1
  flutter_pcm_sound: ^3.3.3
  unorm_dart: ^0.3.0
  android_intent_plus: ^6.1.0
  flutter_svg: ^2.3.2
  record: ^7.1.2
dev_dependencies:
  path_provider: ^2.1.6             # integration_test only
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/Account.png
    # The .onnx voice and translator models are stored with Git LFS: install it before cloning.
    - assets/tts/models/
    - assets/translation/models/
    - assets/translation/data/
    # Only existing folders (a missing one stops the build): add assets/audio/bNN/ when recorded.
    - assets/lessons/
    - assets/images/lessons/
    - assets/images/mascots/
    - assets/images/avatars/
    - assets/images/profile/
    - assets/images/words/
    - assets/images/culture/
    - assets/images/situations/

  # V6 font for the learning screens (SIL Open Font License, see OFL.txt).
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-ExtraBoldItalic.ttf
          weight: 800
          style: italic
